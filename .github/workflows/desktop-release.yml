name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: dist:linux
          - os: windows-latest
            platform: windows
            command: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach package to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          package_tag="v$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "$package_tag" ]]; then
            echo "Release tag must match the package version"
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "The release must be a draft"
            exit 1
          fi
          packages=("dist/mithra-desktop-${RELEASE_TAG#v}-${PLATFORM}-x64.zip")
          if [[ "$PLATFORM" == "windows" ]]; then
            packages+=("dist/mithra-desktop-${RELEASE_TAG#v}-windows-x64-setup.exe")
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}"
