appId: com.mithra.desktop
productName: Mithra Desktop
directories:
  output: dist
files:
  - main.cjs
  - browser-controls.cjs
  - settings-store.cjs
  - preload.cjs
  - ui/**
  - package.json
asar: true
win:
  signAndEditExecutable: false
  artifactName: mithra-desktop-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: mithra-desktop-${version}-windows-${arch}-setup.${ext}
linux:
  category: Utility
  artifactName: mithra-desktop-${version}-linux-${arch}.${ext}
